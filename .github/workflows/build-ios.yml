name: Build laya.cpp with Split ICU XCFrameworks

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-laya-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout do seu repositório
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar ferramentas
      run: |
        brew install cmake

    # ----------------------------------------------------------------
    # ETAPA 1: Compilar nlohmann_json Cruzado para iOS (arm64)
    # ----------------------------------------------------------------
    - name: Clonar e Compilar nlohmann_json para iOS
      run: |
        git clone --depth 1 https://github.com/nlohmann/json.git json_src
        mkdir -p json_src/build_ios && cd json_src/build_ios
        cmake .. \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
          -DJSON_BuildTests=OFF
        cmake --build . --config Release
        cmake --install . --prefix ../../ios_deps

    # ----------------------------------------------------------------
    # ETAPA 2: Baixar os Ativos Pré-compilados do ICU do GitHub
    # ----------------------------------------------------------------
    - name: Baixar Pacotes do ICU (Release 78.3.0)
      run: |
        mkdir -p icu_download
        cd icu_download

        BASE_URL="https://github.com/apotocki/icu4c-iosx/releases/download/78.3.0"

        echo "Iniciando downloads dos binários de iOS..."
        curl -L -O "${BASE_URL}/include.zip"
        curl -L -O "${BASE_URL}/icuuc.xcframework.zip"
        curl -L -O "${BASE_URL}/icui18n.xcframework.zip"
        curl -L -O "${BASE_URL}/icudata.xcframework.zip"
        curl -L -O "${BASE_URL}/icuio.xcframework.zip"

        ls -la

    # ----------------------------------------------------------------
    # ETAPA 3: Extrair Cabeçalhos e Binários ios-arm64 do ICU
    # ----------------------------------------------------------------
    - name: Descompactar e Estruturar os Zips do ICU
      run: |
        mkdir -p ios_deps/icu/include
        mkdir -p ios_deps/icu/lib

        echo "Extraindo cabeçalhos..."
        unzip -q icu_download/include.zip -d temp_include

        if [ -d "temp_include/unicode" ]; then
          cp -R temp_include/unicode ios_deps/icu/include/
        else
          find temp_include -type d -name "unicode" -exec cp -R {} ios_deps/icu/include/ \;
        fi

        echo "Extraindo bibliotecas XCFramework..."
        for zipfile in icuuc.xcframework.zip icui18n.xcframework.zip icudata.xcframework.zip icuio.xcframework.zip; do
          if [ -f "icu_download/$zipfile" ]; then
            echo "Descompactando $zipfile..."
            unzip -q "icu_download/$zipfile" -d temp_libs
          fi
        done

        find temp_libs -path "*/ios-arm64/*.a" -exec cp {} ios_deps/icu/lib/ \;

        echo "=== HEADERS ICU ==="
        ls -la ios_deps/icu/include/
        ls -la ios_deps/icu/include/unicode/ | head -n 5
        echo "=== LIBS ICU ==="
        ls -la ios_deps/icu/lib/

    # ----------------------------------------------------------------
    # ETAPA 4: Compilar laya.cpp como Biblioteca Estática (.a)
    # ----------------------------------------------------------------
    - name: Configurar laya.cpp Cruzado para iPhone
      run: |
        mkdir -p build
        cd build

        cmake .. \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DLAYA_CUDA=OFF \
          -DLAYA_COREML=ON \
          -DLAYA_VULKAN=OFF \
          -DGGML_CUDA=OFF \
          -DGGML_VULKAN=OFF \
          -DGGML_METAL=ON \
          -DGGML_METAL_EMBED_LIBRARY=ON \
          -DGGML_ACCELERATE=ON \
          -DGGML_BUILD_EXAMPLES=OFF \
          -DGGML_BUILD_TESTS=OFF \
          -Dnlohmann_json_DIR="$GITHUB_WORKSPACE/ios_deps/share/cmake/nlohmann_json" \
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/ios_deps/icu" \
          -DICU_ROOT="$GITHUB_WORKSPACE/ios_deps/icu" \
          -DICU_INCLUDE_DIR="$GITHUB_WORKSPACE/ios_deps/icu/include" \
          -DICU_INCLUDE_DIRS="$GITHUB_WORKSPACE/ios_deps/icu/include" \
          -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
          -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH

    - name: Compilar Alvo Final laya.a
      run: |
        cd build
        cmake --build . --target laya --config Release

    - name: Verificar artefatos gerados
      run: |
        echo "=== liblaya ==="
        find build -name "liblaya.a"
        echo "=== ggml libs ==="
        find build -name "libggml*.a"
        echo "=== icu libs ==="
        ls -la ios_deps/icu/lib/

    # ----------------------------------------------------------------
    # ETAPA 5: Coletar TODAS as bibliotecas estáticas necessárias
    # ----------------------------------------------------------------
    - name: Coletar todas as .a necessárias
      run: |
        mkdir -p laya-ios-bundle/libs
        mkdir -p laya-ios-bundle/include

        # 1. laya
        find build -name "liblaya.a" -exec cp {} laya-ios-bundle/libs/ \;

        # 2. ggml (todas as variantes que existirem)
        find build -name "libggml*.a" -exec cp {} laya-ios-bundle/libs/ \;

        # 3. ICU (todas as libs estáticas do iOS)
        cp ios_deps/icu/lib/*.a laya-ios-bundle/libs/ 2>/dev/null || true

        # 4. Headers públicos do ggml e da laya
        find build -name "ggml.h" -exec cp {} laya-ios-bundle/include/ \; 2>/dev/null || true
        find build -name "ggml-backend.h" -exec cp {} laya-ios-bundle/include/ \; 2>/dev/null || true
        find build -name "ggml-cpu.h" -exec cp {} laya-ios-bundle/include/ \; 2>/dev/null || true
        find build -name "ggml-metal.h" -exec cp {} laya-ios-bundle/include/ \; 2>/dev/null || true
        find build -name "ggml-alloc.h" -exec cp {} laya-ios-bundle/include/ \; 2>/dev/null || true
        find build -name "gguf.h" -exec cp {} laya-ios-bundle/include/ \; 2>/dev/null || true
        find build -name "llama.h" -exec cp {} laya-ios-bundle/include/ \; 2>/dev/null || true
        find build -name "runtime.hpp" -exec cp {} laya-ios-bundle/include/ \; 2>/dev/null || true
        find build -name "coreml.hpp" -exec cp {} laya-ios-bundle/include/ \; 2>/dev/null || true
        find build -name "precision.hpp" -exec cp {} laya-ios-bundle/include/ \; 2>/dev/null || true
        find build -name "decision.hpp" -exec cp {} laya-ios-bundle/include/ \; 2>/dev/null || true
        find build -name "http.hpp" -exec cp {} laya-ios-bundle/include/ \; 2>/dev/null || true

        echo "========================================"
        echo "CONTEÚDO DO BUNDLE:"
        ls -la laya-ios-bundle/libs/
        echo "========================================"
        echo "TOTAL DE LIBS:"
        ls laya-ios-bundle/libs/ | wc -l

    - name: Upload do bundle completo
      uses: actions/upload-artifact@v4
      with:
        name: laya-ios-bundle
        path: laya-ios-bundle/
        retention-days: 30