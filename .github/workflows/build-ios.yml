name: Build laya.cpp for iOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest 

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
      with:
        submodules: recursive 

    - name: Configurar ferramentas de build
      run: |
        brew install cmake

    - name: Configurar o Build Estrito (Apenas a biblioteca Laya Core)
      run: |
        mkdir build
        cd build
        # Passamos argumentos para desativar os executáveis que pedem ICU e JSON
        cmake .. \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
          -DCMAKE_BUILD_TYPE=Release \
          -DLAYA_CUDA=OFF \
          -DLAYA_COREML=ON \
          -DLAYA_VULKAN=OFF \
          -DGGML_CUDA=OFF \
          -DGGML_BUILD_EXAMPLES=OFF \
          -DGGML_BUILD_TESTS=OFF

    - name: Compilar apenas o Laya Core
      run: |
        cd build
        # Forçamos o make/ninja a compilar especificamente o target 'laya' e 'ggml'
        cmake --build . --target laya --config Release

    - name: Upload do Binário Compilado (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: laya-cpp-ios-arm64
        path: |
          build/liblaya.a
          build/third_party/ggml/src/libggml.a
