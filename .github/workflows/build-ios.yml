name: Build laya.cpp for iOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest 

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
      with:
        submodules: recursive 

    - name: Configurar ferramentas de build
      run: |
        brew install cmake nlohmann-json icu4c
        echo "export PATH=\"/opt/homebrew/opt/icu4c/bin:/opt/homebrew/opt/icu4c/sbin:\$PATH\"" >> $GITHUB_ENV

    - name: Configurar o Build (Desativando CUDA e Ativando Core ML)
      run: |
        mkdir build
        cd build
        # Forçamos explicitamente o desligamento do CUDA e ativamos o Core ML para a Apple
        cmake .. \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_BUILD_TYPE=Release \
          -DLAYA_CUDA=OFF \
          -DLAYA_COREML=ON \
          -DGGML_CUDA=OFF \
          -DDEPLOYMENT_TARGET=16.0

    - name: Compilar o laya.cpp
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload do Binário Compilado (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: laya-cpp-ios-arm64
        path: |
          build/bin/
          build/*.a
