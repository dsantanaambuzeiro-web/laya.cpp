name: Build laya.cpp for iOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest 

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
      with:
        submodules: recursive 

    - name: Configurar ferramentas e dependências
      run: |
        brew install cmake nlohmann-json icu4c
        # Mapeia as variáveis de ambiente com os caminhos corretos do Homebrew
        echo "ICU_ROOT=/opt/homebrew/opt/icu4c" >> $GITHUB_ENV
        echo "NLOHMANN_JSON_DIR=/opt/homebrew/opt/nlohmann-json/share/cmake/nlohmann_json" >> $GITHUB_ENV

    - name: Configurar o Build com Dependências Mapeadas
      run: |
        mkdir build
        cd build
        # Forçamos o CMake a ler os caminhos do ICU e JSON que o Homebrew instalou
        cmake .. \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
          -DCMAKE_BUILD_TYPE=Release \
          -DLAYA_CUDA=OFF \
          -DLAYA_COREML=ON \
          -DLAYA_VULKAN=OFF \
          -DGGML_CUDA=OFF \
          -DGGML_BUILD_EXAMPLES=OFF \
          -DGGML_BUILD_TESTS=OFF \
          -DICU_ROOT="${{ env.ICU_ROOT }}" \
          -Dnlohmann_json_DIR="${{ env.NLOHMANN_JSON_DIR }}"

    - name: Compilar a Biblioteca
      run: |
        cd build
        cmake --build . --target laya --config Release

    - name: Upload do Binário Compilado (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: laya-cpp-ios-arm64
        path: |
          build/liblaya.a
          build/third_party/ggml/src/libggml.a
